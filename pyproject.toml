[project]
name = "minihack-remdm-planner"
version = "0.1.0"
description = "ReMDM diffusion planner for MiniHack navigation environments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core
    "torch>=2.1",
    "numpy>=1.26",
    "pyyaml>=6.0",

    # Environment
    "nle>=1.2",
    "minihack>=1.0",
    "gymnasium>=1.0",

    # Experiment tracking
    "wandb>=0.15",
    "tqdm>=4.65",

    # Analysis (RL fine-tuning ablation suite)
    "matplotlib>=3.8",
    "polars>=1.0",
    "orjson>=3.9",

    # Utilities
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "experiments"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src", "experiments"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
