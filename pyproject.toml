[project]
name = "minihack-remdm-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.8.0",
    "ipython>=9.12.0",
    "matplotlib>=3.10.8",
    "minihack>=1.0.2",
    "nle>=1.2.0",
    "numpy>=2.4.4",
    "orjson>=3.11.8",
    "polars>=1.39.3",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "sb3-contrib>=2.8.0",
    "scipy>=1.17.1",
    "stable-baselines3>=2.8.0",
    "torch>=2.11.0",
    "wandb>=0.25.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: entry points that take more than a few seconds (deselected by default; run with -m slow)",
]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
