# =============================================================================
# QMUL H200 GPU -- machine values for the final paper run
# =============================================================================
#
# The training recipe lives in configs/defaults.yaml, which both clusters
# share. Only this machine's values live here: worker counts and the
# output path. Everything else -- total_timesteps, batch sizes, the
# offline BC compute-match pins, AMP and torch.compile -- is inherited.
#
# This config drives BOTH the final DAgger run that produced
# `checkpoint_final/online/final.pth` AND the compute-matched offline BC
# baseline used for the paper comparison.
#
#   --mode online    -> reproduces the iter600 DAgger checkpoint recipe
#   --mode offline   -> trains a fair offline BC baseline against it
#
# See configs/defaults.yaml for the fairness analysis behind the shared
# recipe (60,000 AdamW updates x 2048 batch = DAgger compute at iter600).
#
# -- Hardware ---------------------------------------------------------
#
# QMUL H200 (constrained VRAM allocation). The DAgger checkpoint was
# produced on this hardware, so the inherited batch sizes and AMP
# settings must stay identical to the original run. 32-worker collection
# is the original perf setting.

# -- Collection workers -----------------------------------------------
# HARDWARE-SPECIFIC. UCL leaves these at the defaults.yaml value of 8.
num_collection_workers: 32
collect_num_workers: 32

# -- Data collection (for offline BC dataset) -------------------------
# HARDWARE-SPECIFIC path. collect_episodes_per_env stays at the
# inherited 5000: 5000 eps x 4 ID envs = 20k oracle trajectories,
# strictly more than the ~7k unique trajectories DAgger had in its
# filtered buffer at iter600.
collect_output: data/oracle_bc_qmul.pt
