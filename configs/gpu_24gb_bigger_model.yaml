# =============================================================================
# GPU-24GB -- larger model study (384-dim, 6 heads)
# =============================================================================
# Deep-merged onto configs/defaults.yaml: only the deltas live here.
# Everything else (environments, diffusion, sampling, LRs, DAgger loop,
# eval episode counts, W&B) is inherited unchanged.

# -- Model ------------------------------------------------------------
# 256 -> 384 dim, 4 -> 6 heads. n_layer stays at the inherited 4, so
# head_dim stays at 64.
n_embd: 384
n_head: 6

# -- Training budget --------------------------------------------------
# 10x the default budget; eval/checkpoint cadences scaled to match so the
# run still yields ~80 evals and ~16 checkpoints.
total_timesteps: 20000000
id_eval_every_timesteps: 250000
ood_eval_every_timesteps: 250000
checkpoint_every_timesteps: 1250000

# -- Batch sizes ------------------------------------------------------
# 3584 -> 4608; the 24 GB card absorbs it at this model size.
offline_batch_size: 4608
dagger_batch_size: 4608

# -- Performance ------------------------------------------------------
# use_amp and torch_compile are inherited as true from defaults.yaml.

# -- Pins against the shared paper recipe in defaults.yaml -------------
# These four OVERRIDE env-step-derived values when non-null. This study
# sets its own total_timesteps (20M) and offline_batch_size (4608), so it
# must derive its offline budget from those: 4340 grad steps. Inheriting
# the recipe's 60000 pin would train it 13.8x longer and invalidate the
# comparison against the other model sizes.
offline_total_grad_steps: null
offline_eval_every_grad_steps: null
offline_checkpoint_every_grad_steps: null
offline_buffer_capacity: null
offline_log_every: 10

# -- Checkpointing ----------------------------------------------------
checkpoint_dir: checkpoints/bigger_model