# =============================================================================
# GPU-24GB -- learning-behaviour study (eta=0.18, B=6144)
# =============================================================================
# Deep-merged onto configs/defaults.yaml: only the deltas live here.
# Model architecture is the default 256-dim / 4-head / 4-layer planner.

# -- Diffusion --------------------------------------------------------
# ReMDM stochastic remask base fraction: 0.15 -> 0.18.
eta: 0.18

# -- Training budget --------------------------------------------------
# 10x the default budget; eval/checkpoint cadences scaled to match so the
# run still yields ~80 evals and ~16 checkpoints.
total_timesteps: 20000000
id_eval_every_timesteps: 250000
ood_eval_every_timesteps: 250000
checkpoint_every_timesteps: 1250000

# -- Batch sizes ------------------------------------------------------
offline_batch_size: 6144
dagger_batch_size: 6144

# -- Performance ------------------------------------------------------
# use_amp and torch_compile are inherited as true from defaults.yaml.

# -- Pins against the shared paper recipe in defaults.yaml -------------
# These four OVERRIDE env-step-derived values when non-null. This study
# sets its own total_timesteps (20M) and offline_batch_size (6144), so it
# must derive its offline budget from those: 3255 grad steps. Inheriting
# the recipe's 60000 pin would train it 18.4x longer and invalidate the
# learning-behaviour curves.
offline_total_grad_steps: null
offline_eval_every_grad_steps: null
offline_checkpoint_every_grad_steps: null
offline_buffer_capacity: null
offline_log_every: 10

# -- Checkpointing ----------------------------------------------------
checkpoint_dir: checkpoints/learning_behaviour