# =============================================================================
# MiniHack ReMDM RL Fine-Tuning Ablation Suite -- UCL 3090 Ti 24GB Configuration
#
# Optimised for 5x NVIDIA RTX 3090 Ti (24GB VRAM each).
# Checkpoint trained with configs/qmul_gpu.yaml on QMUL H200 8GB.
#
# Changes vs ablations_default.yaml:
#   - AMP enabled (FP16 forward/backward) -- ~2x speedup on 3090 Ti
#   - Full default batch_size (3072) -- 3090 Ti 24GB handles this easily
#   - Default episodes_per_iter (30) -- more data per iter than QMUL's 20
#   - Default diffusion_steps_collect (5) -- better collection quality
#   - Default diagnostic frequencies (25 iters) -- denser curves than QMUL
#   - CKA every 50 iters (most expensive diagnostic, keep less frequent)
# =============================================================================

# -- Training loop ------------------------------------------------------------
max_iter: 500
batch_size: 5120
lr: 3.0e-4
weight_decay: 1.0e-4
max_grad_norm: 1.0
grad_steps_per_iter: 1
episodes_per_iter: 30
diffusion_steps_collect: 5

# -- GPU performance ----------------------------------------------------------
use_amp: true
# Skip torch.compile -- compilation overhead not worth it for 500 iters.
torch_compile: false

# -- Evaluation ---------------------------------------------------------------
eval_every: 25
eval_episodes: 20

# -- Diagnostic frequencies ---------------------------------------------------
grad_align_every: 25
repr_drift_every: 25
t_analysis_every: 25
cka_every: 50
per_layer_every: 25
t_analysis_n_bins: 10
cka_batch_size: 128

# -- Return / advantage weighting --------------------------------------------
win_threshold: 0.5
return_weight_floor: 0.1
return_weight_cap: 5.0

# -- Group A: Regularisation / Constraint Methods -----------------------------
ewc_lambda: 100.0
ewc_fisher_batches: 20
llrd_decay: 0.9
lora_rank: 8
lora_alpha: 16.0
mixed_replay_ratio: 0.25
mixed_replay_buffer_size: 10000
trust_region_kl: 0.05
kl_coef: 0.1

# -- Group B: Training Signal Modifications ----------------------------------
t_curriculum_start: 0.8
t_curriculum_end: 0.2
t_curriculum_steps: 200
t_max_low: 0.2
entropy_coef: 0.01
adv_clip_eps: 0.2

# -- Group D: Reward / Data Quality ------------------------------------------
reward_filter_percentile: 75
running_stats_ema_decay: 0.99
reward_model_width: 64
reward_model_depth: 2
reward_model_lr: 1.0e-3
reward_model_train_steps: 50

# -- Output / Logging --------------------------------------------------------
ablation_use_wandb: true
ablation_wandb_project: "remdm-minihack-ablations"

# -- Multi-seed ---------------------------------------------------------------
num_seeds: 1
