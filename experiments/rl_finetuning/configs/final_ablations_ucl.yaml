# =============================================================================
# MiniHack ReMDM RL Fine-Tuning Ablation Suite -- UCL 3090 Ti 24GB Configuration
#
# Optimised for 5x NVIDIA RTX 3090 Ti (24GB VRAM each).
# Checkpoint trained with configs/qmul_gpu.yaml on QMUL H200 8GB.
#
# Inherits everything from ablations_default.yaml; only the keys that differ
# on this machine live below.  In particular the default cadences are already
# what we want here (eval/diagnostics every 25 iters, CKA every 50,
# episodes_per_iter 30, diffusion_steps_collect 5), so they are not repeated.
#
# Changes vs ablations_default.yaml:
#   - AMP enabled (FP16 forward/backward) -- ~2x speedup on 3090 Ti
#   - Larger batch (4608 vs 3072) -- 3090 Ti 24GB handles this easily
#   - Full-size CKA batch (128 vs 64) -- memory is not a constraint
#   - Three seeds per ablation (vs 1)
# =============================================================================

extends: ablations_default.yaml

# -- Training loop ------------------------------------------------------------
# See PERF-X7 in run_ablations.py: at this batch size the suite reaches ~94% of
# VRAM on a 16GB card, hence the expandable_segments allocator setting.  On
# 24GB it is comfortable.
batch_size: 4608

# -- GPU performance ----------------------------------------------------------
use_amp: true

# -- Diagnostic frequencies ---------------------------------------------------
# Full-size CKA batch; the 24GB card absorbs the activation cache.
cka_batch_size: 128

# -- Multi-seed ---------------------------------------------------------------
num_seeds: 3  # C-001 (D7/F-048): three literal seeds (base 0 -> 0, 1, 2), matching the published 3-run tables