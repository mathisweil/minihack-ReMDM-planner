# =============================================================================
# MiniHack ReMDM RL Fine-Tuning Ablation Suite -- UCL 3090 Ti 24GB Configuration
#
# Optimised for 5x NVIDIA RTX 3090 Ti (24GB VRAM each).
# Checkpoint trained with configs/final_qmul_gpu.yaml on QMUL H200 8GB.
#
# This is the reference config: all published MiniHack ablation results were
# produced with it. Inherits everything from ablations_default.yaml, which now
# carries the settings both machines share (AMP on, three seeds per ablation).
# The default cadences are already what we want here (eval/diagnostics every
# 25 iters, CKA every 50, episodes_per_iter 30, diffusion_steps_collect 5), so
# they are not repeated.
#
# Changes vs ablations_default.yaml:
#   - Larger batch (4608 vs 3072) -- 3090 Ti 24GB handles this easily
#   - Full-size CKA batch (128 vs 64) -- memory is not a constraint
# =============================================================================

# -- Training loop ------------------------------------------------------------
# See PERF-X7 in run_ablations.py: at this batch size the suite reaches ~94% of
# VRAM on a 16GB card, hence the expandable_segments allocator setting.  On
# 24GB it is comfortable.
batch_size: 4608

# -- Diagnostic frequencies ---------------------------------------------------
# Full-size CKA batch; the 24GB card absorbs the activation cache.
cka_batch_size: 128
