# =============================================================================
# MiniHack ReMDM RL Fine-Tuning Ablation Suite -- QMUL H200 8GB Configuration
#
# Optimised for training efficiency on QMUL H200 GPU (8GB VRAM).
# Inherits everything from ablations_default.yaml; only the keys that differ
# on this machine live below.
#
# Changes vs ablations_default.yaml:
#   - AMP enabled (FP16 forward/backward)
#   - Smaller batch (512 vs 3072) fitting comfortably in 8GB with AMP
#   - Fewer collection episodes per iter (20 vs 30) to cut CPU-bound overhead
#   - Fewer denoising steps during collection (3 vs 5)
#   - Less frequent eval + diagnostics to reduce non-training wall-clock
#   - Three seeds per ablation (vs 1)
# =============================================================================

extends: ablations_default.yaml

# -- Training loop ------------------------------------------------------------
# 8GB VRAM: 512 windows per gradient step is the largest that leaves headroom
# for the diagnostic passes.
batch_size: 512
# Reduced from 30 to cut CPU-bound MiniHack episode overhead
# (~5-10s saved per iter).
episodes_per_iter: 20
# Fewer denoising steps during greedy collection. 3 steps is sufficient
# for argmax decoding; saves 40% of collection GPU time vs 5.
diffusion_steps_collect: 3

# -- GPU performance ----------------------------------------------------------
# FP16 mixed precision. ~2x speedup on gradient steps. Model is small
# (~4M params) so memory is not the bottleneck, but AMP still helps throughput.
use_amp: true

# -- Evaluation ---------------------------------------------------------------
# Evaluate every 50 iters (vs 25 default). 10 eval points over 500 iters
# is sufficient to rank ablations. Halves eval wall-clock.
eval_every: 50
# 10 episodes per env during eval (vs 20 default). Noisier but adequate
# for ablation screening. 10 eps x 7 envs = 70 eval episodes per checkpoint.
eval_episodes: 10

# -- Diagnostic frequencies ---------------------------------------------------
# All diagnostics at 50-iter intervals (vs 25 default) to reduce overhead.
# Gives 10 data points per ablation -- enough for analysis plots.
grad_align_every: 50
repr_drift_every: 50
t_analysis_every: 50
# CKA is the most expensive diagnostic. Run every 100 iters (vs 50 default).
cka_every: 100
per_layer_every: 50
# Smaller CKA batch to save memory during the expensive CKA pass.
cka_batch_size: 32

# -- Multi-seed ---------------------------------------------------------------
num_seeds: 3  # C-001 (D7/F-048): three literal seeds (base 0 -> 0, 1, 2), matching the published 3-run tables