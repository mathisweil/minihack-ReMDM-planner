# =============================================================================
# MiniHack ReMDM RL Fine-Tuning Ablation Suite -- Fast Configuration
#
# Override keys for quick CI / smoke testing.  This file is an OVERLAY, not a
# link in the extends chain: when --fast is passed it is applied raw on top of
# whatever ablations config is in use, so it never drags default values back
# over a machine config (a GPU-H200 run with --fast keeps the machine keys this
# file does not set, such as use_amp and diffusion_steps_collect=3, and picks up
# only the keys listed below -- batch_size included, which is set here).
#
# Passing this file to --ablations-config directly still works; it then
# inherits ablations_default.yaml implicitly like any other config.
# =============================================================================

# -- Training loop ------------------------------------------------------------
max_iter: 50
batch_size: 128
episodes_per_iter: 2
grad_steps_per_iter: 1

# -- Evaluation ---------------------------------------------------------------
eval_every: 10
eval_episodes: 5

# -- Diagnostic frequencies ---------------------------------------------------
grad_align_every: 10
repr_drift_every: 10
t_analysis_every: 10
cka_every: 25
per_layer_every: 10

# -- Misc (reduce compute for expensive ablations) ---------------------------
ewc_fisher_batches: 5
reward_model_train_steps: 10
mixed_replay_buffer_size: 500